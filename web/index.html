<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    Firebase JS SDK preload for FlutterFire web.

    FlutterFire normally injects an inline <script> at runtime that does a
    dynamic import() of https://www.gstatic.com/firebasejs/12.18.0/*.js
    That injection path can fail with
    "Failed to fetch dynamically imported module" (CSP / Trusted Types /
    module-graph race). Instead, we load the modules natively here, expose
    them on `window` exactly like the FlutterFire loader does
    (window.firebase_core / firebase_auth / firebase_firestore /
    firebase_app-check), and tell FlutterFire to skip its own injection via
    window.flutterfire_ignore_scripts.

    IMPORTANT: keep this version in sync with the FlutterFire plugin
    (firebase_core_web -> supportedFirebaseJsSdkVersion).
  -->
  <script>
    // Skip FlutterFire's own dynamic import() injection for these services.
    // The service names must match what the web plugins register
    // (core is registered with the override name "core").
    window.flutterfire_ignore_scripts = ['core', 'app-check', 'auth', 'firestore'];
  </script>
  <script type="module">
    const version = '12.18.0';
    const base = 'https://www.gstatic.com/firebasejs/' + version + '/';

    // Load firebase-app.js FIRST: every component bundle statically imports
    // from it, so the module graph must be rooted before fanning out.
    const core = await import(base + 'firebase-app.js');
    window.firebase_core = core;

    const [auth, firestore, appCheck] = await Promise.all([
      import(base + 'firebase-auth.js'),
      // FlutterFire uses the pipelines bundle for Firestore; it also serves
      // standard (non-pipeline) Firestore queries.
      import(base + 'firebase-firestore-pipelines.js'),
      import(base + 'firebase-app-check.js'),
    ]);

    // Expose module namespaces on `window` under the exact keys the
    // FlutterFire interop reads.
    window.firebase_auth = auth;
    window.firebase_firestore = firestore;
    window['firebase_app-check'] = appCheck;

    console.debug('[flutterfire-preload] Firebase JS SDK ' + version + ' loaded:', {
      core: !!window.firebase_core,
      auth: !!window.firebase_auth,
      firestore: !!window.firebase_firestore,
      appCheck: !!window['firebase_app-check'],
    });
  </script>
  <title>my_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
